{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Management Login | Kubera Kirana Shop</title>
    <link rel="stylesheet" href="{% static 'store/css/password-toggle.css' %}">
    <script src="{% static 'store/js/password-toggle.js' %}" defer></script>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: #739df3;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-box {
            width: 380px;
            background: white;

            padding: 35px;

            border-radius: 12px;

            box-shadow:
                0 5px 20px rgba(0, 0, 0, 0.12);
        }

        .login-box h1 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 8px;
        }

        .login-box .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            color: #333;
        }

        input {
            width: 100%;
            padding: 12px;

            border: 1px solid #ccc;
            border-radius: 6px;

            margin-bottom: 18px;

            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #3498db;
        }

        button {
            width: 100%;

            padding: 13px;

            border: none;
            border-radius: 6px;

            background: #2c3e50;
            color: white;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;
        }

        button:hover {
            background: #34495e;
        }

        .error {
            background: #fdecea;
            color: #c0392b;

            padding: 10px;
            border-radius: 6px;

            margin-bottom: 20px;

            text-align: center;
        }

        .management-title {
            text-align: center;
            color: #3498db;

            font-size: 14px;
            font-weight: bold;

            margin-bottom: 8px;
        }

    </style>

</head>

<body>

    <div class="login-box">

        <p class="management-title">
            KUBERA KIRANA SHOP
        </p>

        <h1>Management Login</h1>

        <p class="subtitle">
            Owner & Employee Access
        </p>


        {% if messages %}

            {% for message in messages %}

                <div class="error">
                    {{ message }}
                </div>

            {% endfor %}

        {% endif %}


        <form method="post">

            {% csrf_token %}


            <label for="username">
                Username
            </label>

            <input
                type="text"
                id="username"
                name="username"
                placeholder="Enter username"
                required
            >


            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter password"
                required
            >


            <button type="submit">
                Login
            </button>

        </form>

    </div>

</body>

</html>
