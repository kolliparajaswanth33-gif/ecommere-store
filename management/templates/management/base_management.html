{% load static %}
<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{% block title %}{% endblock %} | Management</title><link rel="stylesheet" href="{% static 'store/css/password-toggle.css' %}"><script src="{% static 'store/js/password-toggle.js' %}" defer></script><style>
body{margin:0;background:#f5f7fb;color:#223;font-family:Arial,sans-serif}.nav{background:#243447;color:#fff;padding:16px 5%;display:flex;align-items:center;gap:18px}.nav a{color:#fff;text-decoration:none}.nav .right{margin-left:auto}.container{max-width:1100px;margin:35px auto;padding:0 20px}.page-heading{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:24px}.page-heading h1{margin:0}.page-heading p{color:#667}.button{display:inline-block;border:0;border-radius:6px;background:#1672c4;color:#fff;text-decoration:none;padding:10px 15px;cursor:pointer;font-weight:bold}.secondary{background:#5c6975}.table-wrap,.employee-form{background:#fff;padding:22px;border-radius:9px;box-shadow:0 2px 10px #dfe4ec}table{border-collapse:collapse;width:100%}th,td{text-align:left;padding:14px 10px;border-bottom:1px solid #e8ebef;vertical-align:middle}small{color:#667}.avatar{width:36px;height:36px;border-radius:50%;object-fit:cover;float:left;margin-right:9px}.status{padding:5px 8px;border-radius:12px;font-size:12px}.active{background:#dff5e5;color:#146c2e}.inactive{background:#fde4e4;color:#a21d1d}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;margin-bottom:25px}.wide{grid-column:1/-1}.field label{display:block;font-weight:bold;margin-bottom:6px}.field input:not([type=checkbox]),.field select,.field textarea{width:100%;box-sizing:border-box;padding:10px;border:1px solid #bfc8d2;border-radius:5px}.field ul{margin:6px 0;color:#a21d1d;padding-left:20px}.errors{background:#fde4e4;color:#a21d1d;padding:12px;margin-bottom:15px}@media(max-width:650px){.form-grid{grid-template-columns:1fr}.page-heading{align-items:flex-start;flex-direction:column}.table-wrap{overflow:auto}}
</style></head><body><nav class="nav"><a href="{% url 'management:dashboard' %}"><strong>Kubera Kirana Shop</strong></a><a href="{% url 'management:employees' %}">Employees</a><a class="right" href="{% url 'management:logout' %}">Logout</a></nav><main class="container">{% if messages %}{% for message in messages %}<p class="errors">{{ message }}</p>{% endfor %}{% endif %}{% block content %}{% endblock %}</main></body></html>
